notes:
  - Has every piece of equipment the recipes in this library call for, so no recipe should show missing equipment.
  - Comfortable with 1 tsp cayenne across a whole dish.
  - Stainless steel frying pan and a shallow baking tray; no wire rack. Instant-read thermometer, in Celsius.
  - Usual cooking oil is refined avocado oil.
